const OBRA_KEYS = ["atelie", "garagem", "casa", "lazer"];
const CUB_ES_VALOR = 3056.76;
const AREA_REFERENCIA = { atelie: 126.963, garagem: 75.648, casa: 250.483, lazer: null };

function estimativaParametrica(obraKey) {
  const area = AREA_REFERENCIA[obraKey];
  if (!area) return null;
  if (obraKey === "garagem") return { min: area * CUB_ES_VALOR * 0.8, max: area * CUB_ES_VALOR * 1.0 };
  return { min: area * CUB_ES_VALOR * 1.0, max: area * CUB_ES_VALOR * 1.5 };
}

function itemTotals(item) {
  const q = toNumber(item.quantidade);
  const pm = toNumber(item.precoUnitMaterial);
  const moTotal = toNumber(item.precoUnitMO);
  const totalMaterial = q * pm;
  const totalItem = totalMaterial + moTotal;
  const realizadoMaterial = toNumber(item.realizadoMaterial);
  const realizadoMO = toNumber(item.realizadoMO);
  const realizado = realizadoMaterial + realizadoMO;
  return { totalMaterial, totalMO: moTotal, totalItem, realizadoMaterial, realizadoMO, realizado };
}

function hasOverride(v) { return v !== undefined && v !== null && v !== ""; }

function obraGrandTotal(obra) {
  const rows = buildSheetRows(obra);
  let estimado = 0, realizado = 0;
  rows.forEach((r) => { if (r.type === "categoria") { estimado += r.total; realizado += r.totalRealizado; } });
  estimado += toNumber(obra.maoDeObraGeral);
  return { estimado, realizado };
}

function formatCurrency(value) {
  const n = toNumber(value);
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function formatDate(dateStr) {
  if (!dateStr) return "—";
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("pt-BR");
}
function priorityBg(priority) {
  if (priority === "Alta") return COLORS.danger;
  if (priority === "Média") return COLORS.amber;
  return COLORS.moss;
}
function classifyTask(urgente, importante) {
  if (urgente === null || importante === null || urgente === undefined || importante === undefined) return null;
  if (urgente && importante) return "fazer-agora";
  return "planejar";
}
function isTaskOverdue(task) {
  if (!task.dueDate || task.status === "Concluído") return false;
  return task.dueDate < todayStr();
}

/* ---------- persistence: db capability with localStorage fallback ---------- */
function usePersistentState(storageKey, defaultValue, dbClient, dbPath, onWriteError) {
  const [value, setValue] = useState(defaultValue);
  const [loaded, setLoaded] = useState(false);
  const lastWritten = useRef(undefined);

  useEffect(() => {
    if (dbClient === "pending") return;
    let unsub = null;
    if (dbClient) {
      const ref = dbClient.doc(dbPath);
      unsub = ref.onSnapshot(
        (snap) => {
          if (snap.exists && snap.data() && snap.data().value !== undefined) {
            const remote = snap.data().value;
            lastWritten.current = JSON.stringify(remote);
            setValue(remote);
          }
          setLoaded(true);
        },
        () => setLoaded(true)
      );
    } else {
      try {
        const raw = window.localStorage.getItem(storageKey);
        if (raw) {
          lastWritten.current = raw;
          setValue(JSON.parse(raw));
        }
      } catch (e) {}
      setLoaded(true);
    }
    return () => { if (unsub) unsub(); };
  }, [dbClient]);

  useEffect(() => {
    if (!loaded) return;
    const serialized = JSON.stringify(value);
    if (serialized === lastWritten.current) return;
    const previousLastWritten = lastWritten.current;
    lastWritten.current = serialized;
    if (dbClient && dbClient !== "pending") {
      dbClient.doc(dbPath).set({ value }).catch((err) => {
        lastWritten.current = previousLastWritten;
        if (onWriteError) onWriteError(err);
      });
    } else if (dbClient === null) {
      try { window.localStorage.setItem(storageKey, serialized); } catch (e) {}
    }
  }, [value, loaded, dbClient]);

  return [value, setValue, loaded];
}

/* ---------- shared bits ---------- */
function YesNoToggle({ value, onChange }) {
  const opt = (v, label) => (
    <button type="button" onClick={() => onChange(v)} style={{ flex: 1, padding: "6px 0", fontSize: 12, fontWeight: 600, border: `1px solid ${COLORS.border}`, background: value === v ? COLORS.primary : "#F7F7EF", color: value === v ? "#fff" : COLORS.inkMuted, cursor: "pointer" }}>{label}</button>
  );
  return (<div style={{ display: "flex", borderRadius: 4, overflow: "hidden" }}>{opt(true, "Sim")}{opt(false, "Não")}</div>);
}

function ConfirmButton({ onConfirm, children, style, confirmLabel }) {
  const [confirming, setConfirming] = useState(false);
  const timeoutRef = useRef(null);
  useEffect(() => () => { if (timeoutRef.current) clearTimeout(timeoutRef.current); }, []);
  function handleClick(e) {
    e.stopPropagation();
    if (confirming) {
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
      setConfirming(false);
      onConfirm();
    } else {
      setConfirming(true);
      timeoutRef.current = setTimeout(() => setConfirming(false), 3000);
    }
  }
  return (
    <button onClick={handleClick} style={confirming ? { ...style, background: COLORS.danger, color: "#fff", fontWeight: 700, border: "none" } : style}>
      {confirming ? (confirmLabel || "Confirmar?") : children}
    </button>
  );
}

function CompareBars({ data }) {
  const max = Math.max(1, ...data.flatMap((d) => [d.estimado, d.realizado]));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {data.map((d) => (
        <div key={d.name}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>{d.name}</div>
          {[["Estimado", d.estimado, COLORS.primaryLight], ["Realizado", d.realizado, COLORS.kiln]].map(([lbl, val, color]) => (
            <div key={lbl} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
              <div style={{ width: 66, fontSize: 10, color: COLORS.inkMuted }}>{lbl}</div>
              <div style={{ flex: 1, background: "#F7F7EF", borderRadius: 3, height: 14 }}>
                <div style={{ width: `${(val / max) * 100}%`, background: color, height: "100%", borderRadius: 3 }} />
              </div>
              <div style={{ width: 110, fontSize: 11, fontFamily: FONT_MONO, textAlign: "right" }}>{formatCurrency(val)}</div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function Tarefas({ tasks, onAddTask, onUpdateTask, onRemoveTask, onMoveTask, onCompleteTask, onReopenTask, onRecomputeStatus }) {
  const [showForm, setShowForm] = useState(false);
  const [view, setView] = useState("quadro");
  const [filterResp, setFilterResp] = useState("Todos");

  function matchesFilter(t) { return filterResp === "Todos" || t.responsavelTipo === filterResp; }
  const activeTasks = tasks.filter((t) => t.status !== "Concluído" && matchesFilter(t));
  const historyTasks = tasks.filter((t) => t.status === "Concluído" && matchesFilter(t)).sort((a, b) => (a.dateCompleted < b.dateCompleted ? 1 : -1));

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, flexWrap: "wrap", gap: 10 }}>
        <div style={{ fontFamily: FONT_SERIF, fontSize: 18 }}>Tarefas</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setView("quadro")} style={view === "quadro" ? btnPrimary : btnGhost}>Quadro</button>
          <button onClick={() => setView("historico")} style={view === "historico" ? btnPrimary : btnGhost}>Histórico</button>
        </div>
      </div>

      {view === "quadro" && (
        <div>
          <div style={{ fontSize: 13, color: COLORS.inkMuted, margin: "6px 0 16px" }}>
            Ao criar a tarefa, já respondam se é urgente e importante — se for o caso, ela já vai para "A fazer". Para mover uma tarefa entre as colunas, arrastem o cartão para o lado.
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 12, color: COLORS.inkMuted }}>Filtro: Responsável</span>
              <select value={filterResp} onChange={(e) => setFilterResp(e.target.value)} style={{ ...inputStyle, fontSize: 12 }}>
                {FILTER_RESPONSAVEL_OPTIONS.map((r) => <option key={r} value={r}>{r}</option>)}
              </select>
            </div>
            {!showForm && <button style={btnGhost} onClick={() => setShowForm(true)}>+ Nova tarefa</button>}
          </div>
          {showForm && (
            <NovaTarefaForm onSubmit={(data) => { onAddTask(data); setShowForm(false); }} onCancel={() => setShowForm(false)} />
          )}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(230px, 1fr))", gap: 12, overflowX: "auto" }}>
            {TASK_STATUS_OPTIONS.map((status) => (
              <TaskColumn key={status} status={status} tasks={activeTasks.filter((t) => t.status === status)} onUpdateTask={onUpdateTask} onRemoveTask={onRemoveTask} onMoveTask={onMoveTask} onCompleteTask={onCompleteTask} onRecomputeStatus={onRecomputeStatus} />
            ))}
          </div>
        </div>
      )}

      {view === "historico" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {historyTasks.length === 0 && <div style={{ ...panelStyle, padding: 24, fontSize: 13, color: COLORS.inkMuted, textAlign: "center" }}>Nenhuma tarefa concluída ainda.</div>}
          {historyTasks.map((task) => (
            <div key={task.id} style={{ ...panelStyle, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
                <div style={{ fontSize: 14, fontWeight: 600, textDecoration: "line-through", color: COLORS.inkMuted }}>{task.title}</div>
                <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                  <span style={{ fontSize: 11, color: COLORS.inkMuted, fontFamily: FONT_MONO }}>concluída em {formatDate(task.dateCompleted)}</span>
                  <button onClick={() => onReopenTask(task.id)} style={{ ...btnGhost, fontSize: 11, padding: "4px 8px" }}>Reabrir</button>
                  <button onClick={() => onRemoveTask(task.id)} style={deleteBtnStyle}>×</button>
                </div>
              </div>
              {task.responsavelTipo && <div style={{ fontSize: 12, color: COLORS.inkMuted, marginTop: 6 }}>Responsável: {task.responsavelTipo === "Outro" ? task.responsavelOutro : task.responsavelTipo}</div>}
              {task.observacoes && <div style={{ fontSize: 12, color: COLORS.inkMuted, marginTop: 4 }}>{task.observacoes}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- Estimativas e Orcamentos ---------- */
function CategoriaCodeInput({ code, onCommit }) {
  const [value, setValue] = useState(code);
  useEffect(() => { setValue(code); }, [code]);
  function commit() {
    const n = parseInt(value, 10);
    if (!isNaN(n) && n > 0 && String(n) !== code) onCommit(n);
    else setValue(code);
  }
  return (
    <input type="text" inputMode="numeric" value={value} onChange={(e) => setValue(e.target.value)} onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } }}
      style={{ width: 30, textAlign: "center", fontFamily: FONT_MONO, fontWeight: 700, border: `1px dotted ${COLORS.dotted}`, borderRadius: 3, background: "transparent", padding: "4px 2px" }} />
  );
}

const GERAL_KEY = "geral";
function buildGeralObra(data) {
  return {
    label: "Geral (Ateliê + Garagem + Casa)",
    reservaPct: 0,
    maoDeObraGeral: 0,
    categorias: [...data.atelie.categorias, ...data.garagem.categorias, ...data.casa.categorias],
  };
}

function buildSheetRows(obra) {
  const rows = [];
  obra.categorias.forEach((cat, ci) => {
    const catRowIdx = rows.length;
    rows.push({ type: "categoria", code: `${ci + 1}`, nome: cat.nome, catId: cat.id, total: 0, totalMaterial: 0, totalMO: 0, realizadoMaterial: 0, realizadoMO: 0, totalRealizado: 0 });
    let catMaterial = 0, catMO = 0, catRealMaterial = 0, catRealMO = 0;
    const catLocked = hasOverride(cat.realizadoMaterialManual) || hasOverride(cat.realizadoMOManual);
    cat.subcategorias.forEach((sub, si) => {
      const subRowIdx = rows.length;
      rows.push({ type: "subcategoria", code: `${ci + 1}.${si + 1}`, nome: sub.nome, catId: cat.id, subId: sub.id, total: 0, totalMaterial: 0, totalMO: 0, realizadoMaterial: 0, realizadoMO: 0, totalRealizado: 0 });
      let subMaterial = 0, subMO = 0, subRealMaterial = 0, subRealMO = 0;
      const subLocked = catLocked || hasOverride(sub.realizadoMaterialManual) || hasOverride(sub.realizadoMOManual);
      sub.itens.forEach((item, ii) => {
        const t = itemTotals(item);
        subMaterial += t.totalMaterial;
        subMO += t.totalMO;
        subRealMaterial += t.realizadoMaterial;
        subRealMO += t.realizadoMO;
        rows.push({ type: "item", code: `${ci + 1}.${si + 1}.${ii + 1}`, item, catId: cat.id, subId: sub.id, total: t.totalItem, locked: subLocked });
      });
      const subRow = rows[subRowIdx];
      subRow.totalMaterial = subMaterial;
      subRow.totalMO = subMO;
      subRow.total = subMaterial + subMO;
      subRow.realizadoMaterial = hasOverride(sub.realizadoMaterialManual) ? toNumber(sub.realizadoMaterialManual) : subRealMaterial;
      subRow.realizadoMO = hasOverride(sub.realizadoMOManual) ? toNumber(sub.realizadoMOManual) : subRealMO;
      subRow.totalRealizado = subRow.realizadoMaterial + subRow.realizadoMO;
      catMaterial += subMaterial;
      catMO += subMO;
      catRealMaterial += subRow.realizadoMaterial;
      catRealMO += subRow.realizadoMO;
    });
    const catRow = rows[catRowIdx];
    catRow.totalMaterial = catMaterial;
    catRow.totalMO = catMO;
    catRow.total = catMaterial + catMO;
    catRow.realizadoMaterial = hasOverride(cat.realizadoMaterialManual) ? toNumber(cat.realizadoMaterialManual) : catRealMaterial;
    catRow.realizadoMO = hasOverride(cat.realizadoMOManual) ? toNumber(cat.realizadoMOManual) : catRealMO;
    catRow.totalRealizado = catRow.realizadoMaterial + catRow.realizadoMO;
  });
  return rows;
}

function EstimativasOrcamentos({ data, unitOptions, onUpdateItem, onAddItemQuick, onRemoveItem, onReorderItem, onReorderCategoriaToPosition, onUpdateReserva, onUpdateMaoDeObraGeral, onAddCategoria, onAddSubcategoria, onRemoveCategoria, onRemoveSubcategoria, onUpdateCategoriaNome, onUpdateSubcategoriaNome, onAddUnitOption, onRemoveUnitOption }) {
  const [obraKey, setObraKey] = useState("atelie");
  const [newCatName, setNewCatName] = useState("");
  const [subCatId, setSubCatId] = useState("");
  const [newSubName, setNewSubName] = useState("");
  const [newUnitName, setNewUnitName] = useState("");
  const [openPanel, setOpenPanel] = useState(null);
  const [draggingItemId, setDraggingItemId] = useState(null);
  const [dragOverItemId, setDragOverItemId] = useState(null);

  const isGeral = obraKey === GERAL_KEY;
  const obra = isGeral ? buildGeralObra(data) : data[obraKey];
  if (isGeral) {
    onUpdateItem = () => {}; onAddItemQuick = () => {}; onRemoveItem = () => {}; onReorderItem = () => {};
    onReorderCategoriaToPosition = () => {}; onUpdateReserva = () => {}; onUpdateMaoDeObraGeral = () => {};
    onAddCategoria = () => {}; onAddSubcategoria = () => {}; onRemoveCategoria = () => {}; onRemoveSubcategoria = () => {};
    onUpdateCategoriaNome = () => {}; onUpdateSubcategoriaNome = () => {}; onAddUnitOption = () => {}; onRemoveUnitOption = () => {};
  }
  const rows = buildSheetRows(obra);
  const { estimado: itemsTotal } = obraGrandTotal(obra);
  const maoDeObraGeral = toNumber(obra.maoDeObraGeral);
  const grandTotal = itemsTotal + maoDeObraGeral;
  const reservaPct = toNumber(obra.reservaPct);
  const reservaValor = (grandTotal * reservaPct) / 100;
  const totalComReserva = grandTotal + reservaValor;

  useEffect(() => { if (!isGeral) setSubCatId(obra.categorias[0] ? obra.categorias[0].id : ""); }, [obraKey]);

  function handleEnter(e, catId, subId) {
    if (e.key === "Enter") {
      e.preventDefault();
      onAddItemQuick(obraKey, catId, subId);
    }
  }

  function scrollToRow(id) {
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 80);
  }

  function submitCategoria() {
    if (!newCatName.trim()) return;
    const newId = uid();
    onAddCategoria(obraKey, newCatName, newId);
    setNewCatName("");
    setOpenPanel(null);
    scrollToRow("cat-row-" + newId);
  }
  function submitSubcategoria() {
    if (!newSubName.trim() || !subCatId) return;
    const newId = uid();
    onAddSubcategoria(obraKey, subCatId, newSubName, newId);
    setNewSubName("");
    setOpenPanel(null);
    scrollToRow("sub-row-" + newId);
  }

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <button style={openPanel === "cat" ? btnPrimary : btnGhost} onClick={() => setOpenPanel(openPanel === "cat" ? null : "cat")}>+ Categoria</button>
        <button style={openPanel === "sub" ? btnPrimary : btnGhost} onClick={() => setOpenPanel(openPanel === "sub" ? null : "sub")}>+ Subcategoria</button>
        <button style={openPanel === "unit" ? btnPrimary : btnGhost} onClick={() => setOpenPanel(openPanel === "unit" ? null : "unit")}>Gerenciar unidades</button>
      </div>

      {openPanel === "cat" && (
        <div style={{ ...panelStyle, padding: 12, marginBottom: 16, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <input autoFocus value={newCatName} onChange={(e) => setNewCatName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitCategoria()} placeholder="Nome da categoria" style={{ ...inputStyle, minWidth: 200 }} />
          <button style={btnPrimary} onClick={submitCategoria}>Adicionar</button>
          <button style={btnGhost} onClick={() => setOpenPanel(null)}>Cancelar</button>
        </div>
      )}
      {openPanel === "sub" && (
        <div style={{ ...panelStyle, padding: 12, marginBottom: 16, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          <select value={subCatId} onChange={(e) => setSubCatId(e.target.value)} style={{ ...inputStyle, minWidth: 180 }}>
            {obra.categorias.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
          </select>
          <input autoFocus value={newSubName} onChange={(e) => setNewSubName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitSubcategoria()} placeholder="Nome da subcategoria" style={{ ...inputStyle, minWidth: 200 }} />
          <button style={btnPrimary} onClick={submitSubcategoria}>Adicionar</button>
          <button style={btnGhost} onClick={() => setOpenPanel(null)}>Cancelar</button>
        </div>
      )}
      {openPanel === "unit" && (
        <div style={{ ...panelStyle, padding: 12, marginBottom: 16 }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
            <input autoFocus value={newUnitName} onChange={(e) => setNewUnitName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && (newUnitName.trim() && (onAddUnitOption(newUnitName), setNewUnitName("")))} placeholder="Ex: pç, cx, rolo..." style={{ ...inputStyle, width: 140 }} />
            <button style={btnPrimary} onClick={() => { if (!newUnitName.trim()) return; onAddUnitOption(newUnitName); setNewUnitName(""); }}>Incluir</button>
            <button style={btnGhost} onClick={() => setOpenPanel(null)}>Fechar</button>
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {unitOptions.map((u) => (
              <span key={u} style={{ display: "inline-flex", alignItems: "center", gap: 4, background: "#F0EFE3", border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: "3px 6px 3px 10px", fontSize: 12 }}>
                {u}
                <button onClick={() => onRemoveUnitOption(u)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkMuted, fontSize: 13, lineHeight: 1, padding: "0 2px" }}>×</button>
              </span>
            ))}
          </div>
        </div>
      )}
      <div style={{ fontFamily: FONT_SERIF, fontSize: 18, marginBottom: 4 }}>Estimativa de Custos</div>
      <div style={{ fontSize: 13, color: COLORS.inkMuted, marginBottom: 16 }}>
        Cliquem em qualquer célula para editar. Para acrescentar um item, pressionem Enter na linha da subcategoria ou em qualquer campo de um item dentro dela.
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        {OBRA_KEYS.map((k) => <button key={k} onClick={() => setObraKey(k)} style={obraKey === k ? btnPrimary : btnGhost}>{data[k].label}</button>)}
        <button onClick={() => setObraKey(GERAL_KEY)} style={obraKey === GERAL_KEY ? btnPrimary : btnGhost}>Geral</button>
      </div>

      <div style={{ ...panelStyle, overflowX: "auto", overflowY: "auto", maxHeight: "65vh" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, minWidth: 900 }}>
          <thead>
            <tr>
              <th style={{ ...stickyThStyle, textAlign: "right" }}>Item</th>
              <th style={{ ...stickyThStyle, textAlign: "left", width: "38%" }}>Descrição</th>
              <th style={{ ...stickyThStyle, textAlign: "right" }}>Unid.</th>
              <th style={{ ...stickyThStyle, textAlign: "right", width: 50 }}>Quant.</th>
              <th style={{ ...stickyThStyle, textAlign: "right" }}>Valor Material</th>
              <th style={{ ...stickyThStyle, textAlign: "right" }}>Valor M.O.</th>
              <th style={{ ...stickyThStyle, textAlign: "right" }}>Total</th>
              <th style={stickyThStyle}></th>
            </tr>
          </thead>
          <tbody>
            {rows.map((row, ri) => {
              if (row.type === "categoria") {
                return (
                  <tr key={row.catId} id={"cat-row-" + row.catId} style={{ background: COLORS.primaryLight }}>
                    <td style={{ padding: "4px 10px", fontWeight: 700, fontFamily: FONT_MONO, borderTop: `2px solid ${COLORS.primary}` }}><CategoriaCodeInput code={row.code} onCommit={(n) => onReorderCategoriaToPosition(obraKey, row.catId, n)} /></td>
                    <td colSpan={5} style={{ padding: "4px 6px", borderTop: `2px solid ${COLORS.primary}` }}>
                      <input value={row.nome} onChange={(e) => onUpdateCategoriaNome(obraKey, row.catId, e.target.value)}
                        style={{ ...cellInputStyle, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.3 }} />
                    </td>
                    <td style={{ padding: "6px 10px", fontWeight: 700, fontFamily: FONT_MONO, textAlign: "right", borderTop: `2px solid ${COLORS.primary}` }}>{formatCurrency(row.total)}</td>
                    <td style={{ borderTop: `2px solid ${COLORS.primary}`, padding: "4px 6px" }}>
                      <ConfirmButton onConfirm={() => onRemoveCategoria(obraKey, row.catId)} style={deleteBtnStyle} confirmLabel="Excluir?">×</ConfirmButton>
                    </td>
                  </tr>
                );
              }
              if (row.type === "subcategoria") {
                return (
                  <tr key={row.subId} id={"sub-row-" + row.subId} style={{ background: "#EDEBDC" }}>
                    <td style={{ padding: "5px 10px", fontWeight: 600, fontFamily: FONT_MONO, color: COLORS.primaryDark }}>{row.code}</td>
                    <td colSpan={4} style={{ padding: "3px 6px" }}>
                      <input value={row.nome} onKeyDown={(e) => handleEnter(e, row.catId, row.subId)}
                        onChange={(e) => onUpdateSubcategoriaNome(obraKey, row.catId, row.subId, e.target.value)}
                        style={{ ...cellInputStyle, fontWeight: 600, color: COLORS.primaryDark }} />
                    </td>
                    <td style={{ padding: "5px 10px", fontWeight: 600, fontFamily: FONT_MONO, textAlign: "right", color: COLORS.primaryDark }}>{formatCurrency(row.total)}</td>
                    <td style={{ padding: "3px 6px" }}>
                      <ConfirmButton onConfirm={() => onRemoveSubcategoria(obraKey, row.catId, row.subId)} style={deleteBtnStyle} confirmLabel="Excluir?">×</ConfirmButton>
                    </td>
                  </tr>
                );
              }
              const item = row.item;
              const t = itemTotals(item);
              const unitList = !item.unidade || unitOptions.includes(item.unidade) ? unitOptions : [item.unidade, ...unitOptions];
              const isDragging = draggingItemId === item.id;
              const isDragOver = dragOverItemId === item.id && draggingItemId && draggingItemId !== item.id;
              const hasMO = hasOverride(item.precoUnitMO);
              return (
                <tr key={item.id}
                  onDragOver={(e) => { e.preventDefault(); if (dragOverItemId !== item.id) setDragOverItemId(item.id); }}
                  onDragLeave={() => { if (dragOverItemId === item.id) setDragOverItemId(null); }}
                  onDrop={(e) => {
                    e.preventDefault();
                    setDragOverItemId(null);
                    setDraggingItemId(null);
                    try {
                      const data = JSON.parse(e.dataTransfer.getData("text/plain"));
                      if (data.subId === row.subId && data.catId === row.catId && data.itemId !== item.id) {
                        onReorderItem(obraKey, row.catId, row.subId, data.itemId, item.id);
                      }
                    } catch (err) {}
                  }}
                  style={{
                    opacity: isDragging ? 0.35 : 1,
                    outline: isDragOver ? `3px solid ${COLORS.primary}` : "none",
                    outlineOffset: "-2px",
                    background: isDragOver ? "#DCEAD6" : (hasMO ? "#F0F0EA" : "#FFFFFF"),
                  }}>
                  <td draggable
                    onDragStart={(e) => { setDraggingItemId(item.id); e.dataTransfer.setData("text/plain", JSON.stringify({ itemId: item.id, catId: row.catId, subId: row.subId })); }}
                    onDragEnd={() => { setDraggingItemId(null); setDragOverItemId(null); }}
                    style={{ padding: "3px 10px", fontFamily: FONT_MONO, color: COLORS.inkMuted, fontSize: 10, borderBottom: `1px solid ${COLORS.border}`, whiteSpace: "nowrap", cursor: "grab" }}>
                    <span style={{ marginRight: 4 }}>⠿</span>{row.code}
                  </td>
                  <td style={{ padding: "2px 3px", borderBottom: `1px solid ${COLORS.border}` }}>
                    <input value={item.desc} onKeyDown={(e) => handleEnter(e, row.catId, row.subId)} onChange={(e) => onUpdateItem(obraKey, row.catId, row.subId, item.id, { desc: e.target.value })} style={cellInputStyle} />
                  </td>
                  <td style={{ padding: "2px 3px", borderBottom: `1px solid ${COLORS.border}` }}>
                    <select value={item.unidade} onKeyDown={(e) => handleEnter(e, row.catId, row.subId)} onChange={(e) => onUpdateItem(obraKey, row.catId, row.subId, item.id, { unidade: e.target.value })} style={{ ...cellInputStyle, textAlign: "center" }}>
                      <option value="">—</option>
                      {unitList.map((u) => <option key={u} value={u}>{u}</option>)}
                    </select>
                  </td>
                  <td style={{ padding: "2px 3px", borderBottom: `1px solid ${COLORS.border}` }}>
                    <input type="text" inputMode="decimal" value={item.quantidade} onKeyDown={(e) => handleEnter(e, row.catId, row.subId)} onChange={(e) => onUpdateItem(obraKey, row.catId, row.subId, item.id, { quantidade: e.target.value })} style={{ ...cellInputStyle, textAlign: "right" }} />
                  </td>
                  <td style={{ padding: "2px 3px", borderBottom: `1px solid ${COLORS.border}` }}>
                    <input type="text" inputMode="decimal" value={item.precoUnitMaterial} onKeyDown={(e) => handleEnter(e, row.catId, row.subId)} onChange={(e) => onUpdateItem(obraKey, row.catId, row.subId, item.id, { precoUnitMaterial: e.target.value })} style={{ ...cellInputStyle, textAlign: "right" }} />
                  </td>
                  <td style={{ padding: "2px 3px", borderBottom: `1px solid ${COLORS.border}` }}>
                    <input type="text" inputMode="decimal" value={item.precoUnitMO} onKeyDown={(e) => handleEnter(e, row.catId, row.subId)} onChange={(e) => onUpdateItem(obraKey, row.catId, row.subId, item.id, { precoUnitMO: e.target.value })} style={{ ...cellInputStyle, textAlign: "right" }} />
                  </td>
                  <td style={{ padding: "3px 10px", fontFamily: FONT_MONO, textAlign: "right", borderBottom: `1px solid ${COLORS.border}`, fontWeight: 600 }}>{formatCurrency(t.totalItem)}</td>
                  <td style={{ padding: "2px 3px", borderBottom: `1px solid ${COLORS.border}` }}>
                    <button onClick={() => onRemoveItem(obraKey, row.catId, row.subId, item.id)} style={deleteBtnStyle}>×</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={{ ...panelStyle, padding: 16, marginTop: 16, maxWidth: 420, marginLeft: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "4px 0" }}><span>Total dos itens (material + M.O. lançados por item)</span><span style={{ fontFamily: FONT_MONO }}>{formatCurrency(itemsTotal)}</span></div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, padding: "4px 0" }}>
          <span>Verba geral de mão de obra (referente aos itens que estão sem valor lançado em MO)</span>
          <input type="text" inputMode="decimal" value={obra.maoDeObraGeral || ""} placeholder="R$ 0,00" onChange={(e) => onUpdateMaoDeObraGeral(obraKey, e.target.value)} style={{ ...inputStyle, width: 110, padding: "2px 4px", textAlign: "right" }} />
        </div>

/* ---------- Financeiro (espelho da Estimativa) ---------- */
function NotaFiscalCell({ item, assetsClient, onUpdateItem, obraKey, catId, subId }) {
  const [uploading, setUploading] = useState(false);
  const inputRef = useRef(null);

  async function handleFile(e) {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file || !assetsClient) return;
    setUploading(true);
    try {
      const result = await assetsClient.upload(file);
      onUpdateItem(obraKey, catId, subId, item.id, { notaFiscalId: result.id, notaFiscalUrl: result.url, notaFiscalType: result.contentType });
    } catch (err) {
      // upload falhou silenciosamente; o campo permanece como estava
    } finally {
      setUploading(false);
    }
  }

  function handleRemove() {
    onUpdateItem(obraKey, catId, subId, item.id, { notaFiscalId: "", notaFiscalUrl: "", notaFiscalType: "" });
  }

  if (assetsClient === "pending") return null;
  if (!assetsClient) return <span style={{ fontSize: 10, color: COLORS.inkMuted }}>indisponível</span>;

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
      {item.notaFiscalId && (
        <>
          {item.notaFiscalType && item.notaFiscalType.indexOf("image/") === 0 ? (
            <a href={item.notaFiscalUrl} target="_blank" rel="noopener noreferrer" title={item.notaFiscalUrl}>
              <img src={item.notaFiscalUrl} alt="Nota fiscal" style={{ width: 30, height: 30, objectFit: "cover", borderRadius: 3, border: `1px solid ${COLORS.border}`, display: "block" }} />
            </a>
          ) : (
            <a href={item.notaFiscalUrl} target="_blank" rel="noopener noreferrer" title={item.notaFiscalUrl} style={{ fontSize: 11, color: COLORS.moss, fontWeight: 600, textDecoration: "none" }}>
              📄 Ver PDF
            </a>
          )}
          <button onClick={handleRemove} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkMuted, fontSize: 13, lineHeight: 1, padding: "0 2px" }}>×</button>
        </>
      )}
      <input ref={inputRef} type="file" accept="image/*,application/pdf" onChange={handleFile} style={{ display: "none" }} id={"nf-" + item.id} />
      <label htmlFor={"nf-" + item.id} style={{ ...btnGhost, fontSize: 10, padding: "3px 6px", cursor: "pointer" }}>
        {uploading ? "Enviando…" : item.notaFiscalId ? "Trocar" : "Anexar"}
      </label>
    </div>
  );
}

                  <td style={{ padding: "3px 10px", fontFamily: FONT_MONO, color: COLORS.inkMuted, fontSize: 10, borderBottom: `1px solid ${COLORS.border}`, whiteSpace: "nowrap" }}>{row.code}</td>
                  <td style={{ padding: "3px 10px", borderBottom: `1px solid ${COLORS.border}` }}>{item.desc || "(sem descrição)"}</td>
                  <td style={{ padding: "3px 10px", fontFamily: FONT_MONO, textAlign: "right", borderBottom: `1px solid ${COLORS.border}` }}>{formatCurrency(t.totalItem)}</td>
                  <td style={{ padding: "3px 6px", borderBottom: `1px solid ${COLORS.border}` }}>
                    <OrcadoCell orc={item.orc1} onChange={(orc) => onUpdateItem(obraKey, row.catId, row.subId, item.id, { orc1: orc })} />
                  </td>
                  <td style={{ padding: "3px 6px", borderBottom: `1px solid ${COLORS.border}` }}>
                    <OrcadoCell orc={item.orc2} onChange={(orc) => onUpdateItem(obraKey, row.catId, row.subId, item.id, { orc2: orc })} />
                  </td>
                  <td style={{ padding: "3px 6px", borderBottom: `1px solid ${COLORS.border}` }}>
                    <OrcadoCell orc={item.orc3} onChange={(orc) => onUpdateItem(obraKey, row.catId, row.subId, item.id, { orc3: orc })} />
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function whatsappLink(phone) {
  const digits = (phone || "").replace(/\D/g, "");
  if (!digits) return null;
  const withCountry = digits.length <= 11 ? "55" + digits : digits;
  return `https://wa.me/${withCountry}`;
}

/* ---------- App ---------- */
function App() {
  const [dbClient, setDbClient] = useState("pending");
  const [assetsClient, setAssetsClient] = useState("pending");
  const [userInfo, setUserInfo] = useState("pending");
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const d = window.claude ? await window.claude.use("db") : null;
        if (alive) setDbClient(d);
      } catch (e) {
        if (alive) setDbClient(null);
      }
      try {
        const a = window.claude ? await window.claude.use("assets") : null;
        if (alive) setAssetsClient(a);
      } catch (e) {
        if (alive) setAssetsClient(null);
      }
      try {
        const u = window.claude ? await window.claude.use("user") : null;
        if (u) {
          const me = await u.me();
          if (alive) setUserInfo(me);
        } else if (alive) {
          setUserInfo(null);
        }
      } catch (e) {
        if (alive) setUserInfo(null);
      }
    })();
    return () => { alive = false; };
  }, []);

  const [writeError, setWriteError] = useState(false);
  function handleWriteError() { setWriteError(true); }

  const [revisions, setRevisions, revisionsLoaded] = usePersistentState("obra_revisions", DEFAULT_REVISIONS, dbClient, "obra/revisions", handleWriteError);
  const [tasks, setTasks, tasksLoaded] = usePersistentState("obra_tasks", [], dbClient, "obra/tasks", handleWriteError);
  const [atelieObra, setAtelieObra, atelieLoaded] = usePersistentState("obra_atelie", DEFAULT_QUANTITATIVOS.atelie, dbClient, "obra/quant_atelie", handleWriteError);
  const [garagemObra, setGaragemObra, garagemLoaded] = usePersistentState("obra_garagem", DEFAULT_QUANTITATIVOS.garagem, dbClient, "obra/quant_garagem", handleWriteError);
  const [casaObra, setCasaObra, casaLoaded] = usePersistentState("obra_casa", DEFAULT_QUANTITATIVOS.casa, dbClient, "obra/quant_casa", handleWriteError);
  const [lazerObra, setLazerObra, lazerLoaded] = usePersistentState("obra_lazer", DEFAULT_QUANTITATIVOS.lazer, dbClient, "obra/quant_lazer", handleWriteError);
  const quantitativos = useMemo(() => ({ atelie: atelieObra, garagem: garagemObra, casa: casaObra, lazer: lazerObra }), [atelieObra, garagemObra, casaObra, lazerObra]);
  const quantLoaded = atelieLoaded && garagemLoaded && casaLoaded && lazerLoaded;
  function getObraSetter(obraKey) {
    if (obraKey === "atelie") return setAtelieObra;
    if (obraKey === "garagem") return setGaragemObra;
    if (obraKey === "casa") return setCasaObra;
    return setLazerObra;
  }
  const [fornecedores, setFornecedores, fornLoaded] = usePersistentState("obra_fornecedores", [], dbClient, "obra/fornecedores", handleWriteError);
  const [unitOptions, setUnitOptions, unitsLoaded] = usePersistentState("obra_units", DEFAULT_UNIT_OPTIONS, dbClient, "obra/units", handleWriteError);
  const [activeTab, setActiveTab] = useState("geral");
  const [undoStack, setUndoStack] = useState([]);

  function pushUndo() {
    setUndoStack((prev) => {
      const snapshot = { revisions, tasks, quantitativos, fornecedores, unitOptions };
      const next = [...prev, snapshot];
      return next.length > 20 ? next.slice(next.length - 20) : next;
    });
  }
  function handleUndo() {
    setUndoStack((prev) => {
      if (prev.length === 0) return prev;
      const last = prev[prev.length - 1];
      setRevisions(last.revisions);
      setTasks(last.tasks);
      setAtelieObra(last.quantitativos.atelie);
      setGaragemObra(last.quantitativos.garagem);
      setCasaObra(last.quantitativos.casa);
      setLazerObra(last.quantitativos.lazer);
      setFornecedores(last.fornecedores);
      setUnitOptions(last.unitOptions);
      return prev.slice(0, -1);
    });
  }

  const loading = dbClient === "pending" || !revisionsLoaded || !tasksLoaded || !quantLoaded || !fornLoaded || !unitsLoaded;

  const totalEstimado = useMemo(() => OBRA_KEYS.reduce((s, k) => s + obraGrandTotal(quantitativos[k]).estimado, 0), [quantitativos]);
  const totalRealizado = useMemo(() => OBRA_KEYS.reduce((s, k) => s + obraGrandTotal(quantitativos[k]).realizado, 0), [quantitativos]);
  const chartData = useMemo(() => OBRA_KEYS.map((k) => {
    const t = obraGrandTotal(quantitativos[k]);
    return { name: quantitativos[k].label, estimado: t.estimado, realizado: t.realizado };
  }), [quantitativos]);

  const pendingRevisions = revisions.filter((r) => r.status !== "Aprovada" && r.status !== "Rejeitada");
  const tasksAguardando = tasks.filter((t) => t.status === "Aguardando programação").length;
  const tasksAtrasadas = tasks.filter((t) => isTaskOverdue(t)).length;

  function addRevision({ title, description, definicoes, priority }) {
    if (!title || !title.trim()) return;
    pushUndo();
    setRevisions((prev) => [...prev, { id: uid(), title: title.trim(), description: (description || "").trim(), definicoes: (definicoes || "").trim(), priority: priority || "Média", status: "A discutir", dateAdded: todayStr() }]);
  }
  function updateRevisionStatus(id, status) { pushUndo(); setRevisions((prev) => prev.map((r) => (r.id === id ? { ...r, status } : r))); }
  function removeRevision(id) { pushUndo(); setRevisions((prev) => prev.filter((r) => r.id !== id)); }
  function clearAllRevisions() { pushUndo(); setRevisions([]); }

  function addTask({ title, urgente, importante, dueDate, responsavelTipo, responsavelOutro, observacoes }) {
    if (!title || !title.trim()) return;
    pushUndo();
    const u = urgente === undefined ? null : urgente;
    const im = importante === undefined ? null : importante;
    const cls = classifyTask(u, im);
    const readyForAFazer = cls === "fazer-agora" || (cls === "planejar" && dueDate);
    setTasks((prev) => [...prev, {
      id: uid(), title: title.trim(), status: readyForAFazer ? "A fazer" : "Aguardando programação",
      urgente: u, importante: im, dueDate: dueDate || "",
      responsavelTipo: responsavelTipo || "", responsavelOutro: responsavelOutro || "", observacoes: observacoes || "",
      dateAdded: todayStr(), dateCompleted: "",
    }]);
  }
  function updateTask(id, patch) {
    pushUndo();
    setTasks((prev) => prev.map((t) => {
      if (t.id !== id) return t;
      const merged = { ...t, ...patch };
      const touchesClassification = "urgente" in patch || "importante" in patch;
      if (touchesClassification && merged.status !== "Em andamento") {
        const cls = classifyTask(merged.urgente, merged.importante);
        const readyForAFazer = cls === "fazer-agora" || (cls === "planejar" && merged.dueDate);
        merged.status = readyForAFazer ? "A fazer" : "Aguardando programação";
      }
      return merged;
    }));
  }
  function recomputeTaskStatus(id) {
    setTasks((prev) => prev.map((t) => {
      if (t.id !== id || t.status === "Em andamento") return t;
      const cls = classifyTask(t.urgente, t.importante);
      const readyForAFazer = cls === "fazer-agora" || (cls === "planejar" && t.dueDate);
      const nextStatus = readyForAFazer ? "A fazer" : "Aguardando programação";
      return nextStatus === t.status ? t : { ...t, status: nextStatus };
    }));
  }
  function moveTask(id, status) { pushUndo(); setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, status } : t))); }
  function completeTask(id) { pushUndo(); setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, status: "Concluído", dateCompleted: todayStr() } : t))); }
  function reopenTask(id) { pushUndo(); setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, status: "Em andamento", dateCompleted: "" } : t))); }
  function removeTask(id) { pushUndo(); setTasks((prev) => prev.filter((t) => t.id !== id)); }

  function updateQuantItem(obraKey, catId, subId, itemId, patch) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({
      ...obra,
      categorias: obra.categorias.map((c) => (c.id !== catId ? c : {
        ...c,
        subcategorias: c.subcategorias.map((s) => (s.id !== subId ? s : { ...s, itens: s.itens.map((it) => (it.id === itemId ? { ...it, ...patch } : it)) })),
      })),
    }));
  }
  function addQuantItemQuick(obraKey, catId, subId) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({
      ...obra,
      categorias: obra.categorias.map((c) => (c.id !== catId ? c : {
        ...c,
        subcategorias: c.subcategorias.map((s) => (s.id !== subId ? s : {
          ...s,
          itens: [...s.itens, { id: uid(), desc: "", espec: "", unidade: "", quantidade: "", obs: "", precoUnitMaterial: "", precoUnitMO: "", realizadoMaterial: "", realizadoMO: "", orc1: mkOrc(), orc2: mkOrc(), orc3: mkOrc() }],
        })),
      })),
    }));
  }
  function addImprevisto(obraKey, catId, subId, { desc, realizadoMaterial, realizadoMO }) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({
      ...obra,
      categorias: obra.categorias.map((c) => (c.id !== catId ? c : {
        ...c,
        subcategorias: c.subcategorias.map((s) => (s.id !== subId ? s : {
          ...s,
          itens: [...s.itens, {
            id: uid(), desc: (desc || "").trim(), espec: "", unidade: "", quantidade: "", obs: "",
            precoUnitMaterial: "", precoUnitMO: "",
            realizadoMaterial: realizadoMaterial || "", realizadoMO: realizadoMO || "",
            orc1: mkOrc(), orc2: mkOrc(), orc3: mkOrc(), imprevisto: true,
          }],
        })),
      })),
    }));
  }
  function removeQuantItem(obraKey, catId, subId, itemId) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({
      ...obra,
      categorias: obra.categorias.map((c) => (c.id !== catId ? c : {
        ...c,
        subcategorias: c.subcategorias.map((s) => (s.id !== subId ? s : { ...s, itens: s.itens.filter((it) => it.id !== itemId) })),
      })),
    }));
  }
  function reorderItem(obraKey, catId, subId, fromItemId, toItemId) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({
      ...obra,
      categorias: obra.categorias.map((c) => (c.id !== catId ? c : {
        ...c,
        subcategorias: c.subcategorias.map((s) => {
          if (s.id !== subId) return s;
          const itens = [...s.itens];
          const fromIdx = itens.findIndex((it) => it.id === fromItemId);
          const toIdx = itens.findIndex((it) => it.id === toItemId);
          if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return s;
          const [moved] = itens.splice(fromIdx, 1);
          itens.splice(toIdx, 0, moved);
          return { ...s, itens };
        }),
      })),
    }));
  }
  function updateReserva(obraKey, value) { pushUndo(); getObraSetter(obraKey)((obra) => ({ ...obra, reservaPct: value })); }
  function updateMaoDeObraGeral(obraKey, value) { pushUndo(); getObraSetter(obraKey)((obra) => ({ ...obra, maoDeObraGeral: value })); }
  function addCategoria(obraKey, nome, id) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({ ...obra, categorias: [...obra.categorias, { id: id || uid(), nome: nome.trim(), subcategorias: [] }] }));
  }
  function addSubcategoria(obraKey, catId, nome, id) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({ ...obra, categorias: obra.categorias.map((c) => (c.id !== catId ? c : { ...c, subcategorias: [...c.subcategorias, { id: id || uid(), nome: nome.trim(), itens: [] }] })) }));
  }
  function removeCategoria(obraKey, catId) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({ ...obra, categorias: obra.categorias.filter((c) => c.id !== catId) }));
  }
  function removeSubcategoria(obraKey, catId, subId) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({ ...obra, categorias: obra.categorias.map((c) => (c.id !== catId ? c : { ...c, subcategorias: c.subcategorias.filter((s) => s.id !== subId) })) }));
  }
  function reorderCategoriaToPosition(obraKey, catId, newPosition) {
    pushUndo();
    getObraSetter(obraKey)((obra) => {
      const categorias = [...obra.categorias];
      const fromIdx = categorias.findIndex((c) => c.id === catId);
      if (fromIdx === -1) return obra;
      const targetIdx = Math.max(0, Math.min(categorias.length - 1, newPosition - 1));
      const [moved] = categorias.splice(fromIdx, 1);
      categorias.splice(targetIdx, 0, moved);
      return { ...obra, categorias };
    });
  }
  function updateCategoriaNome(obraKey, catId, nome) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({ ...obra, categorias: obra.categorias.map((c) => (c.id !== catId ? c : { ...c, nome })) }));
  }
  function updateSubcategoriaNome(obraKey, catId, subId, nome) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({ ...obra, categorias: obra.categorias.map((c) => (c.id !== catId ? c : { ...c, subcategorias: c.subcategorias.map((s) => (s.id !== subId ? s : { ...s, nome })) })) }));
  }
  function updateCategoriaRealizado(obraKey, catId, field, value) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({ ...obra, categorias: obra.categorias.map((c) => (c.id !== catId ? c : { ...c, [field]: value })) }));
  }
  function updateSubcategoriaRealizado(obraKey, catId, subId, field, value) {
    pushUndo();
    getObraSetter(obraKey)((obra) => ({ ...obra, categorias: obra.categorias.map((c) => (c.id !== catId ? c : { ...c, subcategorias: c.subcategorias.map((s) => (s.id !== subId ? s : { ...s, [field]: value })) })) }));
  }
  function addUnitOption(name) {
    const clean = name.trim();
    if (!clean) return;
    pushUndo();
    setUnitOptions((prev) => (prev.includes(clean) ? prev : [...prev, clean]));
  }
  function removeUnitOption(name) {
    pushUndo();
    setUnitOptions((prev) => prev.filter((u) => u !== name));
  }

  function addFornecedor(form) { if (!form.nome || !form.nome.trim()) return; pushUndo(); setFornecedores((prev) => [...prev, { id: uid(), ...form }]); }
  function updateFornecedor(id, patch) { pushUndo(); setFornecedores((prev) => prev.map((f) => (f.id === id ? { ...f, ...patch } : f))); }
  function removeFornecedor(id) { pushUndo(); setFornecedores((prev) => prev.filter((f) => f.id !== id)); }

  if (loading) {
    return <div style={{ fontFamily: FONT_SANS, padding: 40, textAlign: "center", color: COLORS.inkMuted, background: COLORS.paper, minHeight: "100vh" }}>Carregando dados da obra…</div>;
  }

  return (
    <div style={{ minHeight: "100vh", fontFamily: FONT_SANS, background: COLORS.paper, color: COLORS.ink }}>
      {dbClient === null && (
        <div style={{ background: COLORS.danger, color: "#fff", padding: "12px 20px", fontSize: 13, fontWeight: 600, textAlign: "center" }}>
          ⚠ Este acesso não conseguiu usar o armazenamento compartilhado — o que for feito aqui fica salvo só neste navegador e não vai aparecer para a outra pessoa.
          {userInfo && userInfo !== "pending" && !userInfo.id ? " Isso costuma acontecer quando esta conta não pertence à mesma organização Claude de quem publicou o aplicativo." : ""}
        </div>
      )}
      {writeError && (
        <div style={{ background: COLORS.danger, color: "#fff", padding: "12px 20px", fontSize: 13, fontWeight: 600, textAlign: "center", display: "flex", justifyContent: "center", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <span>⚠ Uma alteração não pôde ser salva no armazenamento compartilhado — provavelmente esta sessão só tem permissão de visualização ("Can view") neste artifact, não de edição. A mudança pode desaparecer se a página for recarregada.</span>
          <button onClick={() => setWriteError(false)} style={{ background: "rgba(255,255,255,0.25)", border: "none", borderRadius: 4, color: "#fff", padding: "4px 10px", cursor: "pointer", fontSize: 12, flexShrink: 0 }}>Ok</button>
        </div>
      )}
      <div style={{ display: "flex", minHeight: dbClient === null ? "calc(100vh - 44px)" : "100vh" }}>
      <div className="obra-sidebar" style={{ width: 220, flexShrink: 0, background: COLORS.primary, display: "flex", flexDirection: "column", padding: "20px 0" }}>
        <div style={{ padding: "0 18px 18px", borderBottom: "1px solid rgba(255,255,255,0.25)", marginBottom: 12 }}>
          <div className="obra-nav-label" style={{ fontFamily: FONT_SERIF, fontSize: 16, fontWeight: 700, color: "#fff", lineHeight: 1.25 }}>GERENCIAMENTO OBRA CASA E ATELIÊ</div>
        </div>
        <nav style={{ display: "flex", flexDirection: "column", gap: 2, padding: "0 8px" }}>
          {TABS.map((t) => {
            const active = activeTab === t.id;
            return (
              <button key={t.id} onClick={() => setActiveTab(t.id)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 10px", borderRadius: 6, border: "none", background: active ? "#F7F7EF" : "transparent", color: active ? COLORS.primaryDark : "#fff", fontFamily: FONT_SANS, fontSize: 13, fontWeight: active ? 700 : 500, cursor: "pointer", textAlign: "left" }}>
                <span style={{ width: 16, textAlign: "center" }}>{t.icon}</span><span className="obra-nav-label">{t.label}</span>
              </button>
            );
          })}
        </nav>
        <div style={{ padding: "0 8px", marginTop: "auto" }}>
          <button onClick={handleUndo} disabled={undoStack.length === 0} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "10px 10px", borderRadius: 6, border: "1px solid rgba(255,255,255,0.4)", background: undoStack.length === 0 ? "transparent" : "rgba(255,255,255,0.15)", color: "#fff", fontFamily: FONT_SANS, fontSize: 13, fontWeight: 600, cursor: undoStack.length === 0 ? "default" : "pointer", opacity: undoStack.length === 0 ? 0.4 : 1 }}>
            <span>↺</span><span className="obra-nav-label">Desfazer{undoStack.length > 0 ? ` (${undoStack.length})` : ""}</span>
          </button>
        </div>
        <div className="obra-nav-label" style={{ padding: "12px 18px 0", fontSize: 10, color: "rgba(255,255,255,0.75)" }}>
          {dbClient ? "dados compartilhados salvos automaticamente" : "salvo neste navegador"}
        </div>
        <div className="obra-nav-label" style={{ padding: "4px 18px 0", fontSize: 10, color: "rgba(255,255,255,0.6)" }}>
          {userInfo && userInfo !== "pending" ? (userInfo.id ? `Conectado como: ${userInfo.name || "(sem nome)"}` : "Sessão sem identidade reconhecida") : ""}
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto" }}>
        <div style={{ maxWidth: 1150, margin: "0 auto", padding: 24 }}>
          {activeTab === "geral" && <VisaoGeral totalEstimado={totalEstimado} totalRealizado={totalRealizado} chartData={chartData} pendingRevisions={pendingRevisions} tasksAguardando={tasksAguardando} tasksAtrasadas={tasksAtrasadas} onGoToTab={setActiveTab} />}
          {activeTab === "tarefas" && <Tarefas tasks={tasks} onAddTask={addTask} onUpdateTask={updateTask} onRemoveTask={removeTask} onMoveTask={moveTask} onCompleteTask={completeTask} onReopenTask={reopenTask} onRecomputeStatus={recomputeTaskStatus} />}
          {activeTab === "estimativas" && (
            <EstimativasOrcamentos
              data={quantitativos} unitOptions={unitOptions}
              onUpdateItem={updateQuantItem} onAddItemQuick={addQuantItemQuick} onRemoveItem={removeQuantItem} onReorderItem={reorderItem} onReorderCategoriaToPosition={reorderCategoriaToPosition}
              onUpdateReserva={updateReserva} onUpdateMaoDeObraGeral={updateMaoDeObraGeral} onAddCategoria={addCategoria} onAddSubcategoria={addSubcategoria}
              onRemoveCategoria={removeCategoria} onRemoveSubcategoria={removeSubcategoria}
              onUpdateCategoriaNome={updateCategoriaNome} onUpdateSubcategoriaNome={updateSubcategoriaNome}
              onAddUnitOption={addUnitOption} onRemoveUnitOption={removeUnitOption}
            />
          )}
          {activeTab === "orcamento" && <Orcamento data={quantitativos} onUpdateItem={updateQuantItem} />}
          {activeTab === "fornecedores" && <Fornecedores fornecedores={fornecedores} onAdd={addFornecedor} onUpdate={updateFornecedor} onRemove={removeFornecedor} />}
          {activeTab === "financeiro" && <Financeiro data={quantitativos} onUpdateItem={updateQuantItem} onUpdateCategoriaRealizado={updateCategoriaRealizado} onUpdateSubcategoriaRealizado={updateSubcategoriaRealizado} onAddImprevisto={addImprevisto} assetsClient={assetsClient} />}
          {activeTab === "revisoes" && <Revisoes revisions={revisions} onAddRevision={addRevision} onUpdateStatus={updateRevisionStatus} onRemove={removeRevision} onClearAll={clearAllRevisions} />}
          <div style={{ marginTop: 24, fontSize: 11, color: COLORS.inkMuted, textAlign: "center" }}>
            {dbClient ? "Os dados ficam salvos e visíveis para quem tiver acesso a este aplicativo dentro da sua organização Claude." : "Os dados ficam salvos apenas neste navegador (não foi possível habilitar o armazenamento compartilhado nesta visualização)."}
          </div>
        </div>
      </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
